<!doctype html><html><head><meta charset="utf-8"><title>Demo App</title>
<style>body{font-family:sans-serif;margin:0;background:#f4f6fb}header{padding:24px 40px;background:#1f6fd1;color:#fff;font-size:28px}
main{padding:40px}button,a.btn{font-size:20px;padding:14px 26px;border:0;border-radius:10px;background:#1f6fd1;color:#fff;margin-right:12px;cursor:pointer;text-decoration:none;display:inline-block}
input[type=text]{font-size:20px;padding:12px;width:420px;border:2px solid #aab;border-radius:8px}
.drop{margin-top:30px;border:3px dashed #1f6fd1;padding:50px;border-radius:16px;font-size:22px;text-align:center;background:#fff;cursor:pointer;width:640px}
.tall{height:2600px;background:linear-gradient(#fff,#cde)}#out{margin-top:20px;font-size:22px}img#prev{max-width:300px;display:none;margin-top:16px}</style></head>
<body><header>Demo App - try it free</header><main>
<h2>Chat with AI</h2>
<input id="chat" type="text" placeholder="Type your message"> <button id="send" onclick="document.getElementById('out').textContent='You said: '+document.getElementById('chat').value">Send</button>
<div id="out"></div>
<div class="drop" id="drop" onclick="document.getElementById('file').click()">Upload photo<input id="file" type="file" accept="image/*" style="display:none"></div>
<img id="prev"><p><a class="btn" href="signup.html">Sign up</a></p>
<div class="tall"><p style="padding:40px">Scroll area</p></div></main>
<script>document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=document.getElementById('prev');i.src=r.result;i.style.display='block';document.getElementById('drop').firstChild.textContent='Uploaded: '+f.name};r.readAsDataURL(f)});</script></body></html>
