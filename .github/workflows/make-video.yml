# One video = one brand-new GitHub-hosted machine. The machine is destroyed when the job ends,
# so nothing a member typed, uploaded or browsed survives. Started by worker/worker.js (Telegram front end).
name: make-video

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "encrypted job (AES-256-GCM, made by the Telegram front end)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check that all secrets are set (fails fast with a clear message)
        env:
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S_PAYLOAD_KEY: ${{ secrets.PAYLOAD_KEY }}
          S_DONE_SECRET: ${{ secrets.DONE_SECRET }}
          S_DONE_URL: ${{ secrets.DONE_URL }}
        run: |
          missing=""
          for n in TELEGRAM_BOT_TOKEN GEMINI_API_KEY PAYLOAD_KEY DONE_SECRET DONE_URL; do
            eval "v=\$S_$n"
            if [ -z "$v" ]; then missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub secrets::These secrets are empty or missing:$missing. Add them under Settings > Secrets and variables > Actions > Secrets (not Variables), spelled exactly like this."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install the virtual screen, video tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb openbox ffmpeg espeak-ng libx11-6 libxtst6 \
            fonts-noto-core fonts-noto-color-emoji fonts-liberation fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make the video (inside the virtual screen) and deliver it to Telegram
        env:
          PAYLOAD: ${{ inputs.payload }}
          PAYLOAD_KEY: ${{ secrets.PAYLOAD_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DONE_URL: ${{ secrets.DONE_URL }}
          DONE_SECRET: ${{ secrets.DONE_SECRET }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AUTOVIDEO_BLOCKED_HOSTS: ${{ vars.BLOCKED_HOSTS }}
          DEBUG_LOGS: ${{ vars.DEBUG_LOGS }}
        run: |
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/job.enc"
          # The logs of a public repo are public: by default the job prints nothing (errors go to the member in Telegram).
          # Set the repository variable DEBUG_LOGS=1 while you are testing your own setup.
          set +e
          if [ "$DEBUG_LOGS" = "1" ]; then python autovideo.py job "$RUNNER_TEMP/job.enc" --enc; else python autovideo.py job "$RUNNER_TEMP/job.enc" --enc >/dev/null 2>&1; fi
          code=$?
          rm -f "$RUNNER_TEMP/job.enc"
          echo "job finished with exit code $code"
          exit $code
